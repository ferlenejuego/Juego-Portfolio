<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.12.0/dist/tabler-icons.min.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/cursor.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/about.css">
    <link rel="stylesheet" href="css/upload.css">
    <link rel="stylesheet" href="css/projects.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <div class="cursor-dot" id="cursorDot"></div>
    <div class="cursor-ring" id="cursorRing"></div>

    <div id="navbarMount"></div>
    <section id="homeMount" class="slide"></section>
    <section id="aboutMount" class="slide"></section>
    <section id="activitiesMount" class="slide"></section>
    <section id="quizzesMount" class="slide"></section>
    <section id="laboratoryMount" class="slide"></section>
    <section id="examsMount" class="slide"></section>
    <section id="projectsMount" class="slide"></section>
    <div id="footerMount"></div>

    <div class="pdf-modal" id="pdfModal">
        <div class="pdf-container">
            <div class="pdf-bar">
                <div class="pdf-file">
                    <span class="pdf-file-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
                    </span>
                    <span class="pdf-bar-title" id="pdfTitle">File Preview</span>
                </div>
                <div class="pdf-actions">
                    <button class="close-btn" id="closePdfBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                    </button>
                </div>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/cursor.js"></script>
    <script src="js/home.js"></script>
    <script src="js/upload.js"></script>
    <script src="js/includes.js"></script>
</body>
</html>
